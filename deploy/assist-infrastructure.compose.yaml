services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: assistpro
      POSTGRES_USER: assistpro
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [assist-private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U assistpro -d assistpro']
      interval: 15s
      timeout: 5s
      retries: 5
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  backup:
    image: postgres:17-bookworm
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: assistpro
      PGDATABASE: assistpro
    secrets: [postgres_password]
    volumes:
      - postgres-backups:/backups
    networks: [assist-private]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        umask 077
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        while true; do
          file="/backups/assistpro-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump -Fc -f "$$file.tmp"
          pg_restore --list "$$file.tmp" > /dev/null
          mv "$$file.tmp" "$$file"
          touch /backups/last-success
          find /backups -name 'assistpro-*.dump' -mtime +14 -delete
          echo "Backup completed at $$(date -u +%FT%TZ)"
          sleep 86400
        done
    healthcheck:
      test: [CMD-SHELL, 'test -n "$$(find /backups -name last-success -mmin -1500)"']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging
  health-monitor:
    image: node:24-bookworm-slim
    user: node
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [node, -e]
    command:
      - |
        const fs = require('node:fs');
        async function probe() {
          let ok = false;
          try {
            const r = await fetch('https://assist.ge/health', {signal: AbortSignal.timeout(10000)});
            const body = await r.json();
            ok = r.ok && body.status === 'ok';
          } catch (_) {}
          fs.writeFileSync('/tmp/assist-health.json', JSON.stringify({ok, at: Date.now()}));
          console.log(JSON.stringify({time: new Date().toISOString(), target: 'https://assist.ge/health', ok}));
        }
        probe(); setInterval(probe, 60000);
    healthcheck:
      test: [CMD, node, -e, "const h=JSON.parse(require('fs').readFileSync('/tmp/assist-health.json'));process.exit(h.ok && Date.now()-h.at < 150000 ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
networks:
  assist-private:
    internal: true
volumes:
  postgres-data:
  postgres-backups:
secrets:
  postgres_password:
    file: /etc/dokploy/assist-infrastructure/postgres-password
