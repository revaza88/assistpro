name: Checks and build

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/assist-ai-chat-pilot]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INTAKE_MODE: disabled
      INDEXING_ENABLED: 'false'
      CHAT_MODE: disabled
      TEST_STAFF_MODE: disabled
      LOG_TO_FILE: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify clean build identity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const release = JSON.parse(readFileSync('dist/release.json', 'utf8'));
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(release.commit, git('rev-parse', 'HEAD'));
          assert.equal(release.tree, git('rev-parse', 'HEAD^{tree}'));
          assert.equal(release.dirty, false);
          NODE
