services:
  web:
    image: ${ASSISTPRO_IMAGE:-assistpro:release-candidate}
    build:
      context: .
      args:
        RELEASE_COMMIT: ${ASSISTPRO_RELEASE_COMMIT:-}
        RELEASE_TREE: ${ASSISTPRO_RELEASE_TREE:-}
        RELEASE_DIRTY: ${ASSISTPRO_RELEASE_DIRTY:-}
    init: true
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: '1'
      INTAKE_MODE: disabled
      DATA_FILE: /app/data/submissions.json
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - local-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  local-data:
